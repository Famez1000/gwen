workflows:
  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Appstore_key

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: nl.mlmasters.anxietyslayer

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate Flutter iOS configuration
        script: |
          flutter build ios --config-only --no-codesign

      - name: Install CocoaPods dependencies
        script: |
          if [ -f ios/Podfile ]; then
            cd ios
            pod install
          else
            echo "No ios/Podfile found; skipping CocoaPods install."
          fi

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=GWEN_AI_FUNCTION_URL=$GWEN_AI_FUNCTION_URL \
            --dart-define=REVENUECAT_IOS_API_KEY=$REVENUECAT_IOS_API_KEY \
            --dart-define=REVENUECAT_ENTITLEMENT_ID=$REVENUECAT_ENTITLEMENT_ID

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
